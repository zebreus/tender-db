# tender-db is a Dioxus *fullstack* app: this crate is compiled by DX into two
# binaries — a `web` client (WASM) and a `server` (Axum) that renders the initial
# HTML and hosts the `#[get]`/`#[post]` server functions. Platform-specific code is
# gated behind the `web` / `server` Cargo features, which DX selects per build.
[package]
name = "tender-db"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dioxus = { workspace = true }
serde = { workspace = true }
model = { workspace = true }
wasm-bindgen = { workspace = true }
# The dashboard's refresh poll. One `Delay` future that works both in the wasm
# client and in a native server render — the alternative is a timer crate per
# platform behind cfgs.
futures-timer = { version = "3", features = ["wasm-bindgen"] }

# Server-only. Every one is optional and reached only through the `server`
# feature, so none of it can leak into the wasm client.
store = { workspace = true, optional = true }
# The ingestion Supervisor (issue 16) drives ingest's fetch/process/project
# library functions in-process; reqwest is its download client.
ingest = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tower_governor = { workspace = true, optional = true }
async-stream = { workspace = true, optional = true }
futures-core = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
# Read-only SQL endpoint (issue 07): turso's own parser for the statement
# allow-list, governor for the per-token hourly quota.
turso_parser = { workspace = true, optional = true }
governor = { workspace = true, optional = true }
# Webhooks (issue 08): Standard-Webhooks HMAC signing + SSRF URL parsing.
sha2 = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
url = { workspace = true, optional = true }
# Deep health probe (issue 24): filesystem stats for the disk-usage signal.
fs4 = { version = "0.13", default-features = false, optional = true }

[dev-dependencies]
# The API integration test boots the real router over a fixture-ingested
# database and talks to it over a real socket.
ingest = { workspace = true }
store = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time"] }
axum = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
serde_json = { workspace = true }
futures = "0.3"
bytes = "1"
# The /admin integration test builds a tiny TED-shaped package to process.
flate2 = { workspace = true }
tar = { workspace = true }
# The webhook integration test verifies delivered signatures independently of
# the code that produced them.
hmac = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }

[features]
default = []
web = ["dioxus/web"]
server = [
    "dioxus/server",
    "dep:store",
    "dep:ingest",
    "dep:reqwest",
    "dep:axum",
    "dep:tokio",
    "tokio/time",
    "tokio/rt-multi-thread",
    "dep:tower_governor",
    "dep:async-stream",
    "dep:futures-core",
    "dep:serde_json",
    "dep:chrono",
    "dep:subtle",
    "dep:turso_parser",
    "dep:governor",
    "dep:sha2",
    "dep:hmac",
    "dep:base64",
    "dep:url",
    "dep:fs4",
]

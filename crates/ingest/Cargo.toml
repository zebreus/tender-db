# Fetchers (TED, DÖE) + era/profile parsers + canonical projection.
# Server-side only; never compiled into the wasm client.
[package]
name = "ingest"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
store = { workspace = true }
turso = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
zip = { workspace = true }
roxmltree = { workspace = true }
encoding_rs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Codec for the Phase-2 bucketed fold's on-disk notice-state buckets (issue 62).
postcard = { workspace = true }

[dev-dependencies]
# Local HTTP fixture server for fetcher tests — no network in tests.
axum = { workspace = true }
tokio = { workspace = true, features = ["net"] }

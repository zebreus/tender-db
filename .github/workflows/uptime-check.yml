# External uptime check for production (issue 24).
#
# The Claude cloud routines that curl /health/deep (the :50 routine and its :20
# twin) fail on their own infrastructure: on 2026-09-29, 4 of 6 runs ended with
# "Cloud container never started" and sent nothing, which is indistinguishable
# from "healthy" to the owner. This is a second, independent watcher on GitHub's
# scheduler. It needs no secrets: the endpoint is public, and the only write is an
# issue in this repository.
#
# Down: /health/deep answers anything but HTTP 200 with a top-level "ok": true,
# after curl's own retries (~1 minute, so a deploy's restart is not an outage).
# Then an issue labelled `uptime` is opened, mentioning the owner, unless one is
# already open. Recovered: the open `uptime` issue is closed with the time.
# `drill: true` (manual runs only) exercises that path with a clearly titled
# issue that mentions nobody and is closed by the same run.
#
# Edit this file through GitHub (web editor or API as the owner), not a session
# push: the schedule of its predecessor, uptime.yml, never fired (issue 24).
name: uptime-check

on:
  schedule:
    - cron: '9,24,39,54 * * * *'
  workflow_dispatch:
    inputs:
      drill:
        description: 'Treat this run as DOWN to exercise the issue path (no mention, closed at once)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /health/deep
        id: probe
        run: |
          set +e
          code=$(curl -sS -A 'tender-db-uptime-gha/1' -o deep.json -w '%{http_code}' \
            --max-time 30 --retry 3 --retry-delay 20 --retry-all-errors \
            https://tenders.zebreus.click/health/deep)
          rc=$?
          ok=$(jq -r '.ok == true' deep.json 2>/dev/null || echo false)
          rev=$(jq -r '.rev // "?"' deep.json 2>/dev/null | cut -c1-7)
          echo "curl exit $rc, HTTP $code, ok=$ok, rev $rev"
          healthy=false
          if [ "$rc" = 0 ] && [ "$code" = 200 ] && [ "$ok" = true ]; then healthy=true; fi
          if [ "${{ inputs.drill }}" = true ]; then healthy=false; fi
          { echo "code=$code"; echo "rc=$rc"; echo "rev=$rev"; echo "healthy=$healthy"; } >> "$GITHUB_OUTPUT"

      - name: Open, keep, or close the uptime issue
        env:
          GH_TOKEN: ${{ github.token }}
          HEALTHY: ${{ steps.probe.outputs.healthy }}
          CODE: ${{ steps.probe.outputs.code }}
          RC: ${{ steps.probe.outputs.rc }}
          DRILL: ${{ inputs.drill }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh label create uptime --repo "$repo" --color B60205 \
            --description 'external uptime check (issue 24)' >/dev/null 2>&1 || true
          open=$(gh issue list --repo "$repo" --label uptime --state open --json number --jq '.[0].number // empty')
          if [ "$HEALTHY" = true ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --repo "$repo" --comment "Recovered at $now: /health/deep answers HTTP 200 with ok=true."
            fi
            exit 0
          fi
          failing=$(jq -c '[(.checks // {}) | to_entries[] | select(.value.ok != true) | {(.key): .value}]' deep.json 2>/dev/null || echo 'no JSON body')
          body="Checked at $now from GitHub Actions ([run]($GITHUB_SERVER_URL/$repo/actions/runs/$GITHUB_RUN_ID)).

          curl exit $RC, HTTP $CODE. Failing checks: \`$failing\`

          The operating session (routine \"tender-db hourly ownership check-in\") owns the repair. This issue closes itself when the check passes again."
          if [ "$DRILL" = true ]; then
            n=$(gh issue create --repo "$repo" --label uptime \
              --title "UPTIME DRILL — not an outage (issue 24)" --body "$body" | grep -o '[0-9]*$')
            gh issue close "$n" --repo "$repo" --comment "Drill: the issue path works; closed by the same run."
            exit 0
          fi
          if [ -z "$open" ]; then
            gh issue create --repo "$repo" --label uptime \
              --title "TENDER-DB DOWN (external check, $now)" --body "@${GITHUB_REPOSITORY_OWNER} $body"
          fi
          exit 1

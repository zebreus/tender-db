# Compile what lands on main (issue 468).
#
# Nothing outside the committing session compiled a push to main: ops/check.sh runs
# over that agent's own tree, and deploy.sh guards prod, not main. Both recorded
# escapes (2026-08-24 in v1/, 2026-08-30 in a supervisor.rs test) broke code that
# only compiles under `--features tender-db/server`, and the second was test code.
#
# So this compiles exactly what the gate (ops/check.sh) compiles, and runs nothing:
#   * the gate's package set in ONE invocation, so features resolve once and the same
#     way the gate resolves them (issue 260);
#   * `--features tender-db/server`, without which accounts, admin, coverage, ledger,
#     plan_capture, supervisor, v1 and webhooks are not compiled at all;
#   * `--all-targets`: tests, benches and examples (crates/*/examples), like the gate's
#     `cargo test` and the flake's clippy check;
#   * `check`, not `test`: no test binaries are linked; running suites stays the gate's job;
#   * `--locked`: a manifest edit pushed without its Cargo.lock change fails here.
#
# Toolchain: stable. The box builds with fenix `stable` pinned by flake.lock
# (nix/package.nix); if the two ever disagree, the box's `nix build` decides.
# No wasm target and no system packages: every dependency is pure Rust (rustls,
# miniz_oxide, turso), and the wasm client (`--features web`) is out of scope.
#
# `claude/**` too: the session branches carry the same commits before main does,
# so a red tree shows up there first.
#
# Drill (owner): push garbage appended to crates/app/src/supervisor.rs on a
# `claude/**` or `ci-drill/**` branch and expect red with the error in supervisor.rs; push the clean
# tree and expect green. A workflow that lost `--features tender-db/server` passes
# that drill green, so the drill pins the footgun itself.
#
# A red `main` is made visible (468's "Make a red run visible"): on refs/heads/main a
# failed check opens one `main-red` issue naming the commit and the run, unless one is
# already open, and the next green run on main closes it — `uptime-check.yml`'s
# open/close step, which issue 24 drilled. Other branches only mark their commit; a
# cancelled run (superseded by a newer push) touches no issue.
name: compile

on:
  push:
    branches:
      - main
      - 'claude/**'
      - 'ci-drill/**'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: compile-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo check (gate package set, server feature, all targets)
        id: check
        continue-on-error: true
        run: cargo check --locked --all-targets -p model -p store -p ingest -p tender-db --features tender-db/server

      - name: Open, keep, or close the main-red issue
        if: github.ref == 'refs/heads/main' && (steps.check.outcome == 'success' || steps.check.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          run="$GITHUB_SERVER_URL/$repo/actions/runs/$GITHUB_RUN_ID"
          gh label create main-red --repo "$repo" --color B60205 \
            --description 'main does not compile (issue 468)' >/dev/null 2>&1 || true
          open=$(gh issue list --repo "$repo" --label main-red --state open --json number --jq '.[0].number // empty')
          if [ "$OUTCOME" = success ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --repo "$repo" --comment "Green again at $now on \`$short\` ([run]($run))."
            fi
            exit 0
          fi
          if [ -z "$open" ]; then
            gh issue create --repo "$repo" --label main-red \
              --title "main does not compile at $short ($now)" \
              --body "\`cargo check --all-targets --features tender-db/server\` failed on \`$GITHUB_SHA\` ([run]($run)). The operating session (routine \"tender-db hourly ownership check-in\") owns the repair; the next green run on main closes this issue."
          else
            gh issue comment "$open" --repo "$repo" --body "Still red at $now on \`$short\` ([run]($run))."
          fi

      - name: Fail the run when the check failed
        if: steps.check.outcome == 'failure'
        run: exit 1

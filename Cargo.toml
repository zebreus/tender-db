# tender-db workspace. Three layers, dependency-ordered:
#   model — shared, serde-serialisable domain types (compiled for wasm AND native)
#   store — server-only Turso persistence
#   app   — the Dioxus fullstack binary (web client + Axum server), see crates/app
[workspace]
resolver = "3"
members = [
    "crates/model",
    "crates/store",
    "crates/ingest",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
model = { path = "crates/model" }
store = { path = "crates/store" }
ingest = { path = "crates/ingest" }

dioxus = { version = "0.7", features = ["fullstack", "router"] }
serde = { version = "1", features = ["derive"] }

# The vendored eForms SDK field metadata is JSON; ingest reads it as the
# ADR-0002 completeness checklist and as the parser's match index.
serde_json = "1"

# wasm-bindgen does NOT follow semver: the `wasm-bindgen` crate version and the
# `wasm-bindgen-cli` that `dx` runs must match EXACTLY or dx refuses to bundle the
# wasm. The dioxus-cli (dx) packaged in nixpkgs bundles 0.2.118, so we pin the
# crate to 0.2.118 to keep the Nix build self-consistent. Bump both together.
wasm-bindgen = "=0.2.118"

# Turso is the pure-Rust SQLite engine (no C; keeps the `nix build` self-contained
# and cross-friendly). Exact pin: bumps are deliberate and re-run the probe
# suite from docs/research/turso-scale.md (the caret req "0.7.0-pre.10" already
# resolved to the 0.7.0 engine anyway).
turso = "=0.7.2"
tokio = { version = "1", features = ["rt", "macros", "sync"] }

# The Phase-2 bucketed fold (issue 62) spills each resolved notice state to an
# order-preserving on-disk bucket as postcard — a compact, self-describing serde
# codec — so the fold reads the parsed layer once sequentially instead of in random
# group_key order. Pure Rust, no C. `use-std` enables `to_stdvec` (the alloc Vec
# serializer) for the server-side spill.
postcard = { version = "1", features = ["use-std"] }

# FFI-only bindings to the system libc (no C compiled, already in the tree
# transitively) — used solely to raise the process `RLIMIT_NOFILE` for the sharded
# Phase-2 pre-pass (issue 66), which holds `n_buckets × workers` shard files open at
# once. Keeps the `nix build` self-contained.
libc = "0.2"

# The public API (`/v1`). axum is already in the tree via dioxus-server, so the
# API sub-router merges into the dioxus router with no version skew
# (docs/research/api-layer.md §1). tower_governor is the per-IP rate limiter,
# async-stream builds the SSE bodies, chrono formats the ISO timestamps the API
# contract promises.
axum = "0.8"
# `default-features = false` drops the tonic integration — we serve HTTP only,
# and tonic would drag a whole gRPC stack into the bundle.
tower_governor = { version = "0.8", default-features = false, features = ["axum"] }
async-stream = "0.3"
futures-core = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std"] }

# Read-only SQL endpoint (issue 07). `turso_parser` is turso's OWN SQL parser,
# already in the tree as a transitive dep of the engine — pinned to the exact
# engine version so its AST always matches what the engine will execute; it is
# the primary allow-list wall (query_only is PRAGMA-escapable,
# docs/research/turso-capabilities.md §2). `governor` is the pure-Rust GCRA
# limiter behind tower_governor, used directly here for the per-token 300/h
# keyed quota (api-layer.md §6).
turso_parser = "=0.7.2"
governor = "0.10"

# Fetcher: rustls so the nix build stays free of system TLS deps.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"

# Constant-time secret comparison for the `/admin` operator secret (issue 16),
# already in tree via the RustCrypto stack.
subtle = "2"

# Webhooks (issue 08). Standard-Webhooks signatures are HMAC-SHA256 over
# `{id}.{timestamp}.{payload}`, base64-encoded — `hmac` + the in-tree `sha2`,
# `base64` for the wire encoding of secret and signature. `url` parses the
# user-supplied endpoint for the SSRF guard (scheme + host). All pure Rust /
# already resolved in the lock.
hmac = "0.12"
base64 = "0.22"
url = "2.5"

# Accounts (docs/research/api-layer.md §5). argon2 0.5 is RustCrypto's pure-Rust
# argon2id; its defaults already are OWASP's recommended parameters. It
# re-exports `password_hash`, which brings the PHC string codec and the OS RNG
# both password salts and the `tdb_` token/session secrets are drawn from — so
# the whole credential stack costs exactly one dependency.
argon2 = "0.5"

# Package walking. TED dailies are .tar.gz; the text era (1993–2010) nests one
# per-language ZIP per member inside that tarball. All pure Rust so `nix build`
# stays free of C toolchain deps: flate2 pinned to the miniz_oxide backend
# (`rust_backend`, not the default-capable zlib one) and zip cut down to
# deflate only (its defaults pull in bzip2/zstd C bindings).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
zip = { version = "6", default-features = false, features = ["deflate"] }

# Text-era (1993–2010) tagged-text members declare their encoding in the member
# name (`_ISO_` = ISO-8859-1, `_UTF8_`); encoding_rs decodes the declared-ISO
# variants (WHATWG mapping: the iso-8859-1 label decodes as windows-1252).
encoding_rs = "0.8"

# Read-only XML tree; profile dispatch matches namespace-URI + local name
# (docs/architecture.md) because real TED files vary the prefix freely
# (ContractNotice / urn:ContractNotice / ns8:ContractNotice all occur).
roxmltree = "0.21"

# The release profile applies to BOTH the wasm client and the native server, so
# keep it server-friendly (default opt-level = 3 for throughput). dx runs
# `wasm-opt` on the client artifact afterwards, which handles wasm size on its own.
[profile.release]
lto = "thin"
strip = true

# Line tables only, not full debuginfo (issue 260): this workspace has ~58
# integration-test binaries, each linking the whole dependency tree, and cargo
# never removes a superseded one — with full debuginfo that graveyard filled the
# dev disk five times in one week. Panic backtraces keep file:line (the part we
# actually read); only variable-level debugger info is dropped. In the profile,
# not an env var, so RAW `cargo test`/`cargo build` is small by default and
# ops/check.sh's CARGO_PROFILE_*_DEBUG=0 override is belt-and-braces, not
# load-bearing. Debugging a specific crate under a full debugger:
# CARGO_PROFILE_DEV_DEBUG=2 cargo build -p <crate>.
[profile.dev]
debug = "line-tables-only" 

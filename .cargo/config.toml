# `crates/app` is a Dioxus fullstack crate: its server-side modules — the whole
# `v1` API, the supervisor, health, metrics — are behind `#[cfg(feature =
# "server")]`, because the same crate also compiles to WASM for the browser client.
#
# The consequence is a trap. `cargo test -p tender-db` compiles the crate WITHOUT
# that feature, finds none of the server-side unit tests, and prints
#
#     test result: ok. 0 passed; 0 failed
#
# which reads exactly like a pass. Nothing is wrong and nothing was checked. So the
# app crate has aliases that always carry the feature:
#
#     cargo test-app                  # the server-side UNIT tests (--lib), and only those
#     cargo test-app health           # filtered, as usual
#     cargo test-app-all              # unit tests AND crates/app/tests/*
#
# `test-app` is `--lib`: it does not build crates/app/tests/{accounts,admin,api,sql,
# webhooks}.rs, and for twelve days the gate ran only it — tests/sql.rs was red the
# whole time (issue 414). Neither alias is the verdict, and neither is the cheap inner
# loop any more: `ops/check.sh` runs ONE cargo invocation over model, store, ingest and
# the server-featured app (issue 260), and a single-package run like these resolves
# features differently and builds a second artifact family of every crate — the disk
# filler CLAUDE.md's Testing section warns about. Use that section's focused command
# (the gate's flags AND the gate's package set) for one test, and the gate for the
# verdict.
[alias]
test-app = "test -p tender-db --features server --lib"
test-app-all = "test -p tender-db --features server --tests"
